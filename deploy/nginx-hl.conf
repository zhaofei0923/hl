# ==========================================
# hl.easudata.com - 婚恋平台 Nginx 站点配置
# 放置位置: /etc/nginx/sites-available/hl
# 启用: ln -s /etc/nginx/sites-available/hl /etc/nginx/sites-enabled/hl
# ==========================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name hl.easudata.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name hl.easudata.com;

    # SSL 证书 (腾讯云下载 Nginx 格式)
    ssl_certificate     /etc/nginx/ssl/hl.easudata.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hl.easudata.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:HL_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 反代到 Docker 容器 (client nginx on port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # 传递大文件 (头像上传)
        client_max_body_size 20m;
    }
}
