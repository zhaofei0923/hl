# ==========================================
# hl.easudata.com - 婚恋平台 Nginx 站点配置
# 放置位置: /etc/nginx/sites-available/hl
# 启用: ln -s /etc/nginx/sites-available/hl /etc/nginx/sites-enabled/hl
# SSL: sudo certbot --nginx -d hl.easudata.com
# ==========================================

server {
    listen 80;
    server_name hl.easudata.com;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 反代到 Docker 容器 (client nginx on port 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # 传递大文件 (头像上传)
        client_max_body_size 20m;
    }
}
