version: '3.8'

# ==========================================
# 婚恋平台 - 生产部署配置
# 所有服务在独立网络中运行，与宿主机其他项目完全隔离
# 
# 启动: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 停止: docker compose -f docker-compose.prod.yml down
# 查看日志: docker compose -f docker-compose.prod.yml logs -f
# 导入测试数据: docker compose -f docker-compose.prod.yml run --rm seed
# ==========================================

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: always
    networks:
      - hl-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # 不对外暴露端口，仅通过 nginx 反代访问
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-hl_matchmaking}
      - DB_USER=${DB_USER:-hl_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CLIENT_URL=${CLIENT_URL:-https://hl.easudata.com}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    networks:
      - hl-network
    volumes:
      - upload-data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  mysql:
    image: mysql:8.0
    # 不对外暴露端口，仅容器间通信
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-hl_matchmaking}
      MYSQL_USER: ${DB_USER:-hl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/src/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./server/src/migrations/add_salon_tables.sql:/docker-entrypoint-initdb.d/02-salon.sql
      - ./server/src/migrations/add_admin_field.sql:/docker-entrypoint-initdb.d/03-admin.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - hl-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    # 不对外暴露端口
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - hl-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # 一次性任务：导入测试/演示数据
  # 用法: docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/migrations/seed_test_data.js
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-hl_matchmaking}
      - DB_USER=${DB_USER:-hl_user}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hl-network
    profiles:
      - tools

volumes:
  mysql-data:
    name: hl_mysql_data
  redis-data:
    name: hl_redis_data
  upload-data:
    name: hl_upload_data

networks:
  hl-network:
    name: hl_network
    driver: bridge
