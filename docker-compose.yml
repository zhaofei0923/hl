# 婚恋中介管理平台 - 开发环境 Docker Compose

services:
  # Frontend - Vue 3 + Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - hl-network
    restart: unless-stopped

  # Backend - Node.js + Express
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads-data:/app/uploads
    networks:
      - hl-network
    restart: unless-stopped

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/src/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./server/src/migrations/add_salon_tables.sql:/docker-entrypoint-initdb.d/02-salon.sql
      - ./server/src/migrations/add_admin_field.sql:/docker-entrypoint-initdb.d/03-admin.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - hl-network
    restart: unless-stopped

  # Redis 7
  redis:
    image: redis:7-alpine
    ports:
      - "${DOCKER_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - hl-network
    restart: unless-stopped

  # 一次性任务：导入测试数据
  # 用法: docker compose run --rm seed
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: node src/migrations/seed_test_data.js
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hl-network
    profiles:
      - tools

volumes:
  mysql-data:
    name: hl_dev_mysql_data
  redis-data:
    name: hl_dev_redis_data
  uploads-data:
    name: hl_dev_uploads_data

networks:
  hl-network:
    name: hl_dev_network
    driver: bridge
